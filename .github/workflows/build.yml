name: Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build macOS app bundle
        run: npx electron-builder --mac --publish=never
      - name: Package macOS DMG
        run: |
          # 查找 .app 文件
          app_dir=$(find dist-electron -name "*.app" -type d -maxdepth 2 | head -1)
          if [ -z "$app_dir" ]; then
            echo "ERROR: No .app found"
            find dist-electron -maxdepth 3 -type d
            exit 1
          fi
          echo "Found: $app_dir"

          # 对 app 进行 ad-hoc 签名（使内部所有 frameworks 签名一致）
          echo "Signing with ad-hoc..."
          codesign --force --deep --sign - "$app_dir"

          # 准备 DMG 内容
          dmg_root="/tmp/dmg-content"
          rm -rf "$dmg_root"
          mkdir -p "$dmg_root"
          cp -R "$app_dir" "$dmg_root/"
          cp scripts/fix-gatekeeper.command "$dmg_root/"
          chmod +x "$dmg_root/fix-gatekeeper.command"
          cp scripts/README.txt "$dmg_root/"
          cp docs/qiniu-kodo-guide.md "$dmg_root/" 2>/dev/null || true

          # 创建 DMG
          DMG_NAME="TinyDo-mac-arm64.dmg"
          hdiutil create -size 600m -fs APFS -volname "TinyDo" \
            -srcfolder "$dmg_root" -format UDZO -ov "dist-electron/$DMG_NAME"
          echo "✅ DMG created: $DMG_NAME"

          # 清理
          rm -rf "$dmg_root"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: dist-electron/TinyDo-mac-arm64.dmg

  build-win:
    name: Build Windows
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Windows portable exe
        run: npx electron-builder --win portable --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: dist-electron/*.exe

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        run: |
          # ubuntu-latest 已预装 Android SDK，直接用即可。
          # 不再使用 android-actions/setup-android@v3：该 action 固定执行
          # `sdkmanager tools`，而 Google 已下架旧版 tools 包（runner 镜像
          # 20260907 起为 cmdline-tools 16.0），必然报
          # "Warning: Failed to find package 'tools'" 并以 exit 1 结束，
          # 导致 Android 任务失败、create-release 被跳过（2026-09-16 起）。
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "使用预装 Android SDK: $SDK"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager（$SDK 下没有 cmdline-tools），请检查 runner 镜像"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          "$SDKMGR" --version
          # 接受许可（构建缺失组件时 AGP 会自动下载），platform-tools 缺失则补装
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install platform-tools > /dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - name: Set up Android project
        run: |
          if [ ! -d "android" ]; then
            CI=true npx cap add android 2>&1 || npx cap add android
            # Fix Kotlin duplicate class conflict (exclude kotlin-stdlib-jdk7/8)
            python3 scripts/fix-kotlin-conflict.py
          fi
          npx cap sync android
        env:
          CI: true
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up iOS project
        run: |
          if [ ! -d "ios/App" ]; then
            CI=true npx cap add ios 2>&1 || npx cap add ios
          fi
        env:
          CI: true
      - name: Build iOS .ipa (ad-hoc)
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/build/ipa/*.ipa

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-mac, build-win, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Prepare release files
        run: |
          mkdir -p release
          cp web-dist/* release/ 2>/dev/null || true
          cp mac-build/* release/ 2>/dev/null || true
          cp win-build/* release/ 2>/dev/null || true
          cp android-build/* release/ 2>/dev/null || true
          cp ios-build/* release/ 2>/dev/null || true
          ls -lh release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
